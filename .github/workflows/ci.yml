# Deliberately cheap. Its job right now is to show real, green CI in the
# history that judges read — not to gate anything. Steps tighten as the
# workspace fills in; nothing here fails on an empty repo.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The lockfile is lockfileVersion 3 written by npm 11. Node 22 ships npm 10,
      # which resolves the transitive tree differently and fails `npm ci` with a wall
      # of "Missing: <pkg> from lock file" — nothing is actually wrong with the lock.
      # Pin npm rather than the Node version, so CI keeps testing the declared floor
      # (engines.node >= 22.18, the version that runs .ts without a flag).
      - name: Pin npm to the version that wrote the lockfile
        run: npm install -g npm@11

      - name: Shell scripts parse
        run: |
          for f in $(git ls-files '*.sh'); do
            echo "-- $f"
            bash -n "$f"
          done

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "no package.json yet — skipping"
          fi

      - name: Lint and typecheck
        run: |
          if [ ! -f package.json ]; then
            echo "no package.json yet — skipping"
            exit 0
          fi
          npm run --if-present lint
          npm run --if-present typecheck

      # The sink and discovery tests are pure: no network, no .env, in-memory
      # SQLite. The commands that do touch the chain are exercised by hand and
      # written up in docs/, not run here.
      - name: Test
        run: |
          if [ ! -f package.json ]; then
            echo "no package.json yet — skipping"
            exit 0
          fi
          npm run --if-present test

  # The web app is a SEPARATE npm package with its own lockfile, so the `node`
  # job above never installs it, never typechecks it and never builds it. It had
  # no CI coverage at all until 2026-09-09 (MOV-270): a broken web build would
  # have surfaced only at `docker compose build`, which nothing here runs.
  #
  # This is the judge-facing surface. It is the last thing that should be
  # unverified.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Same reason as the root job: the lockfile was written by npm 11, and
      # npm 10 refuses it.
      - name: Pin npm to the version that wrote the lockfile
        run: npm install -g npm@11

      # `web/` imports across the repo (rails/, buyer/, seller/, graph/,
      # identity/, mcp-turnstile/) rather than vendoring copies, so the root
      # install has to happen too or the type resolution fails on paths that are
      # perfectly correct.
      - name: Install
        run: |
          npm ci
          npm ci --prefix web

      - name: Typecheck
        run: npm run typecheck --prefix web

      # `next build` runs TypeScript over the transitive graph, which reaches
      # the co-located *.test.ts files. That is how web/Dockerfile was found to
      # have never built at all. No .env is needed: every page that reads a
      # chain is force-dynamic, so nothing is prerendered at build time.
      - name: Build
        run: npm run build --prefix web

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # The ENS contracts we compile against are submodules, pinned to the
          # revisions contracts-v2 itself pins. Recursive because contracts-v2
          # carries its own.
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: '1.8.1'

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      - name: Test
        working-directory: contracts
        # Local tests only. The fork tests run in their own job so that a flaky
        # public RPC cannot redden the build history judges read.
        run: forge test --no-match-path 'test/fork/*' -vv

  contracts-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Advisory. This job carries the ENS redeploy canary — if it goes red, every
    # address in contracts/addresses.sepolia.json is stale and the ENS work needs
    # re-checking. It does not gate, because it depends on a free public RPC.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: '1.8.1'

      - name: Fork tests against live Sepolia
        working-directory: contracts
        run: forge test --match-path 'test/fork/*' -vv
