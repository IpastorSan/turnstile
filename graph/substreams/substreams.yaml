specVersion: v0.1.0
package:
  name: erc8004_agent_registry
  version: v0.1.0
  url: https://github.com/IpastorSan/turnstile
imports: {}

protobuf:
  files:
    - turnstile/erc8004/v1/agent_registry.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/erc8004_agent_registry.wasm

modules:
  - name: map_agent_registrations
    kind: map
    initialBlock: 24339871
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:turnstile.erc8004.v1.AgentRegistrations
    doc: |
      Decodes Registered, URIUpdated and MetadataSet("agentWallet") from one
      ERC-8004 Identity Registry and normalizes them.

      Params are `&`-separated key=value pairs:
        registry  required, 0x-hex address of the Identity Registry
        chain_id  required, decimal EVM chain id
        network   optional, label echoed into the output (defaults to the
                  CAIP-2 id, e.g. "eip155:8453")

  - name: store_agent_wallets
    kind: store
    initialBlock: 24339871
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_agent_registrations
    doc: |
      Latest `agentWallet` payout address per `agent_uid`. Composable: a
      downstream module can read this to resolve the address an agent is paid
      at without re-decoding the registry.

  - name: map_agent_directory
    kind: map
    initialBlock: 24339871
    inputs:
      - map: map_agent_registrations
      - store: store_agent_wallets
    output:
      type: proto:turnstile.erc8004.v1.AgentRegistrations

params:
  map_agent_registrations: "registry=0x8004a169fb4a3325136eb29fa0ceb6d2e539a432&chain_id=1&network=mainnet"

network: mainnet

# One pipeline, four chains. `substreams run --network base ...` swaps the
# registry address, chain id and start block; the WASM is identical.
networks:
  mainnet:
    initialBlock:
      map_agent_registrations: 24339871
      store_agent_wallets: 24339871
      map_agent_directory: 24339871
    params:
      map_agent_registrations: "registry=0x8004a169fb4a3325136eb29fa0ceb6d2e539a432&chain_id=1&network=mainnet"

  base:
    initialBlock:
      map_agent_registrations: 41663783
      store_agent_wallets: 41663783
      map_agent_directory: 41663783
    params:
      map_agent_registrations: "registry=0x8004a169fb4a3325136eb29fa0ceb6d2e539a432&chain_id=8453&network=base"

  sepolia:
    initialBlock:
      map_agent_registrations: 9989393
      store_agent_wallets: 9989393
      map_agent_directory: 9989393
    params:
      map_agent_registrations: "registry=0x8004a818bfb912233c491871b3d84c89a494bd9e&chain_id=11155111&network=sepolia"

  base-sepolia:
    initialBlock:
      map_agent_registrations: 36304145
      store_agent_wallets: 36304145
      map_agent_directory: 36304145
    params:
      map_agent_registrations: "registry=0x8004a818bfb912233c491871b3d84c89a494bd9e&chain_id=84532&network=base-sepolia"
