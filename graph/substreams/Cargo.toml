[package]
name = "erc8004-agent-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Normalized ERC-8004 agent-registry Substreams module, reusable across EVM chains"
publish = false

[lib]
name = "erc8004_agent_registry"
crate-type = ["cdylib"]

[dependencies]
substreams = "0.7.6"
substreams-ethereum = "0.11.1"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
ethabi = "17.2"

[build-dependencies]
anyhow = "1"
substreams-ethereum = "0.11.1"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
