# ==========================================================================
# CRE SECRETS — the two things the enclave is given and nobody else sees
# ==========================================================================
# Maps the secret id the workflow asks for with `runtime.getSecret({ id })` to
# the environment variable holding its value.
#
# The Vault DON releases these directly into the attested enclave. They are
# never in plaintext to node operators, and never in Workflow DON node memory.
#
# EVIDENCE_TOKEN  the bearer token that opens the seller's evidence endpoint.
#                 `seller/cre/evidence-server.ts` answers 401 without it, so a
#                 successful fetch in the simulation log is itself the proof
#                 that the secret reached the enclave.
#
# CALIBRATION     the seller's tuned thresholds, as a JSON object of overrides
#                 onto the public set in `seller/analyst/scoring.ts`. This is
#                 the method. The workflow binary is not confidential — the
#                 enclave protects the *data* it computes over — so the edge
#                 has to live here rather than in the code, and it does.
secretsNames:
    EVIDENCE_TOKEN:
        - TURNSTILE_EVIDENCE_TOKEN
    CALIBRATION:
        - TURNSTILE_CALIBRATION
