openapi: 3.1.0

# The wire contract for seller/service/. Hand-written against app.ts and
# tiers.ts, and cross-checked against the captured transcript in
# docs/x402-service.md — including the shape of the 402, which is the part of
# this document a generic OpenAPI generator would have got wrong.
#
# Two audiences, and they want the same thing:
#
#   - A human judge asking what Turnstile actually sells.
#   - An agent runtime that turns this file into tools. Bazantic generates a
#     hosted MCP server from it (docs/bazantic-gateway.md), which means every
#     `description` below is the tool documentation an agent reads when deciding
#     whether to call an operation. They are therefore written as when/why/how
#     guidance, not as a restatement of the response shape. Keep them that way.
#
# Verified 2026-09-07 with @apidevtools/swagger-parser.

info:
  title: Turnstile Liquidity Analyst
  version: 0.1.0
  summary: >-
    Is this Uniswap v3 pool safe to LP? Answered from indexed history and a live
    quote, not from TVL.
  license:
    name: MIT
    identifier: MIT
  description: |-
    Turnstile sells a **judgement**, not a query result.

    The one question it answers is: *is this pool safe to provide liquidity to?*
    That is not the same question as "what is its TVL", and the difference is the
    product. An LP is short volatility and long fees, exposed to the pool's
    inventory rather than to its headline number, so the analyst combines two
    sources that disagree in useful ways:

    | Source | Answers | Cannot answer |
    |---|---|---|
    | A Messari-conformant DEX AMM subgraph on The Graph | what the pool *has been* — realized fee revenue, trading continuity, LP count, age | it is indexed, therefore behind; its USD prices are derived from pools, so checking a pool against them is circular |
    | Uniswap **QuoterV2**, at the current block | what the pool *will do* — depth at size, slippage, initialized ticks crossed | one instant, with no history and no notion of whether that instant is typical |

    Neither source alone answers the question. Cumulative volume cannot tell you
    the pool emptied yesterday; a live quote cannot tell you it only ever trades
    for one hour a day. The verdict lives in the gap between them.

    **Every response states its own provenance and its own caveats.** `confidence`
    is not decoration: it falls when there is no live quote, when the subgraph is
    stale, when a token is unpriced, and when the depth ladder had to be sized
    using a price the subgraph derived from the very pool under examination. A
    response never silently omits what it could not get — read `caveats` before
    acting on `rating`.

    ## Payment

    Both `/analyze` routes are **x402 v2** and answer `402 Payment Required` with
    a signed challenge before they answer anything else. See the `402` response
    on either operation for the exact shape; the headers are:

    | Header | Direction | Carries |
    |---|---|---|
    | `PAYMENT-REQUIRED` | on the 402 | base64 of the `PaymentRequired` object |
    | `PAYMENT-SIGNATURE` | on the retry | base64 of the `PaymentPayload` |
    | `PAYMENT-RESPONSE` | on the paid 200 | base64 of the `SettleResponse` |

    These are v2 spellings, **not** v1's `X-PAYMENT` / `X-PAYMENT-RESPONSE`. Both
    exist in `@x402/core` because it still speaks v1; anything new should be v2.

    Settlement is real. Turnstile settles on Hedera testnet through the Blocky402
    facilitator and writes a receipt to an HCS consensus topic, retrievable
    afterwards from `/receipts/{transaction}`. `/health` reports `settlementLive`
    so a client can tell whether any advertised rail is still a placeholder.

    A request that could not have succeeded is never charged for: a malformed pool
    address is rejected with `400` **before** a challenge is issued.

servers:
  - url: https://REPLACE-ME.example
    description: >-
      Public base URL of the seller service. There is no hosted deployment yet —
      see docs/deploy.md. Substitute the deployment's origin at registration time.
  - url: http://127.0.0.1:3400
    description: Local development, as started by `npm run serve`. The port is printed on boot.

tags:
  - name: analysis
    description: Paid. The LP-safety verdict, in two tiers that differ by how much evidence you get.
  - name: service
    description: Free. Service state and payment receipts.

paths:
  /analyze/{pool}:
    get:
      operationId: analyzePoolStandard
      tags: [analysis]
      summary: LP-safety verdict from indexed history alone ($0.07).
      description: |-
        **When to use this.** You are screening — ranking or filtering many pools,
        and you want something better than a TVL sort without paying for a live
        quote on every candidate. This is the cheap pass.

        **What it does.** Answers from the Messari-conformant subgraph on The Graph
        only: realized fee revenue, trading continuity across sparse hourly
        buckets, pool age, LP count, and the two-sidedness of reserves. It costs
        one indexed query and no RPC call, which is most of why it is cheaper.

        **What it cannot tell you, and says so.** There is no live quote in this
        tier, so it cannot tell you what a trade would actually execute at right
        now. The verdict states this in `caveats` and carries a lower `confidence`
        accordingly — it reports that it is flying blind rather than pretending
        otherwise. A pool can look healthy across its whole indexed history and
        still be unable to fill a $1,000 trade at this instant; only
        `analyzePoolAttested` can see that.

        **How to read the result.** `rating` is the answer; `signals` is why. A
        `structural` signal that fails means the pool is not a venue at all, and
        one of those is enough to justify AVOID. A non-structural failure is a
        reason for care, not for walking away. Each signal carries the numbers its
        headline rests on, so the conclusion is auditable rather than asserted.

        **Cost.** $0.07 per call. Escalate to `analyzePoolAttested` only for the
        candidates that survive this pass.
      parameters:
        - $ref: '#/components/parameters/Pool'
      responses:
        '200':
          description: The verdict, and the tier that produced it.
          headers:
            PAYMENT-RESPONSE:
              $ref: '#/components/headers/PaymentResponse'
          content:
            application/json:
              schema:
                type: object
                required: [tier, verdict]
                properties:
                  tier:
                    const: standard
                  verdict:
                    $ref: '#/components/schemas/Verdict'
        '400':
          $ref: '#/components/responses/BadPool'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '500':
          $ref: '#/components/responses/ServiceError'

  /analyze/{pool}/attested:
    get:
      operationId: analyzePoolAttested
      tags: [analysis]
      summary: >-
        LP-safety verdict with a live Uniswap depth ladder and the re-derivable
        scorer input ($0.35).
      description: |-
        **When to use this.** You are about to commit capital, or you need a number
        you can defend to someone else. Use it on the shortlist that
        `analyzePoolStandard` produced, not on every candidate.

        **Why it costs five times as much.** It adds the half of the evidence that
        history cannot supply. Alongside the same subgraph history, it quotes the
        pool **live against Uniswap QuoterV2 at the current block**, walking a
        depth ladder — typically $1k, $10k, $100k, $1M, $10M — and reporting for
        each rung the executed output, the realized slippage, and the number of
        **initialized ticks crossed**. Ticks crossed is the load-bearing number: in
        concentrated liquidity it tells you how much of the range the trade had to
        eat through, which is what determines whether the next trade is worse.

        **The finding this tier exists to produce.** Combining the two sources
        yields conclusions neither reaches alone. On Uniswap v3 USDC/WETH 0.05%
        the verdict is ACCEPTABLE at 75% confidence — and the live ladder shows
        that only **0.944%** of the pool's claimed TVL is reachable within 1%
        slippage. The subgraph supplies the claimed TVL; the quoter supplies the
        reachable depth; the ratio is the answer, and it exists only because both
        were asked. In concentrated liquidity a small ratio is normal, since most
        capital sits outside the active range by design — but it does mean the
        headline number overstates fee-earning capital by two orders of magnitude,
        and an LP sizing a position off TVL will be disappointed.

        **Where the two sources disagree, believe the quote.** The subgraph is
        indexed and therefore behind; `provenance.subgraphLagSeconds` tells you by
        how much. The quote is taken at `provenance.depthBlock` and is the only
        measurement here that reflects the pool as it is now.

        **What else you get.** The complete `analystInput` — about 9KB of plain
        JSON — which is the exact argument the scorer was called with. The scorer
        is a pure total function of it, so a buyer holding this object can
        re-derive the verdict independently and get the same bytes. The claim is
        checkable rather than merely asserted. `attestation` carries the Chainlink
        TEE attestation over those bytes when one is available, and degrades
        explicitly rather than silently when it is not.

        **A standard-tier payment cannot buy this route.** The challenge is bound
        to the URL it was issued for, and the price differs (70000 < 350000). Pay
        against a challenge issued by *this* path.

        **Cost.** $0.35 per call, under the $0.50 ceiling published on chain for
        this service.
      parameters:
        - $ref: '#/components/parameters/Pool'
      responses:
        '200':
          description: >-
            The verdict, the live depth profile inside it, the scorer input, and
            the attestation over that input.
          headers:
            PAYMENT-RESPONSE:
              $ref: '#/components/headers/PaymentResponse'
          content:
            application/json:
              schema:
                type: object
                required: [tier, verdict, analystInput]
                properties:
                  tier:
                    const: premium
                  verdict:
                    $ref: '#/components/schemas/Verdict'
                  analystInput:
                    allOf:
                      - $ref: '#/components/schemas/AnalystInput'
                    description: >-
                      The exact argument the pure scorer was called with. Re-run it
                      to reproduce `verdict` byte for byte.
                  attestation:
                    type: [object, 'null']
                    description: >-
                      Attestation over the bytes of `analystInput`. Null or
                      explicitly degraded when no attester was reachable — never
                      silently omitted.
        '400':
          $ref: '#/components/responses/BadPool'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '500':
          $ref: '#/components/responses/ServiceError'

  /receipts/{transaction}:
    get:
      operationId: getReceipt
      tags: [service]
      summary: Look up the settlement receipt for a payment already made. Free.
      description: |-
        **When to use this.** After paying, to prove you paid — for reconciliation,
        for an audit trail, or to show a third party that a specific verdict was
        bought rather than fabricated.

        Takes the `transaction` from the decoded `PAYMENT-RESPONSE` of a paid call
        and returns the rail's receipt for it. On the Hedera rail this is backed by
        a message on an HCS consensus topic, so the receipt is independently
        verifiable on a public ledger rather than only in Turnstile's own records.

        Free and unauthenticated: a receipt is evidence, and evidence you have to
        pay to see is worth less.
      parameters:
        - name: transaction
          in: path
          required: true
          description: >-
            Rail-specific transaction id, as returned in the decoded
            `PAYMENT-RESPONSE` of the paid call. On the live Hedera rail this is a
            Hedera transaction id; against a placeholder rail it is a `stub:…` id.
          schema:
            type: string
            minLength: 1
          examples:
            hedera:
              summary: A real settled payment on Hedera testnet
              value: 0.0.7162784@1788791855.758948636
      responses:
        '200':
          description: The receipt, as the settling rail recorded it.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: No rail holds a receipt for that transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      operationId: getHealth
      tags: [service]
      summary: Service state, payment rails, and current tier pricing. Free.
      description: |-
        **When to use this.** Before the first paid call in a session — to learn the
        current price of each tier rather than assuming one, and to check
        `settlementLive` before relying on a payment actually moving value.

        `settlementLive` is deliberately honest: it is `false` when *every*
        advertised rail is still a placeholder. A demo that quietly settles nothing
        is worse than one that says so.

        Free and unauthenticated.
      responses:
        '200':
          description: >-
            Service name, whether any rail settles real value, the rails, and the
            tiers with their prices in USD.
          content:
            application/json:
              schema:
                type: object
                required: [service, settlementLive, rails, tiers]
                properties:
                  service:
                    type: string
                    examples: [liquidity.turnstile.eth]
                  settlementLive:
                    type: boolean
                    description: >-
                      True when at least one advertised rail settles real value.
                      False when every rail is a placeholder.
                  rails:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rail'
                  tiers:
                    type: array
                    items:
                      type: object
                      required: [id, priceUsd, description]
                      properties:
                        id:
                          type: string
                          enum: [standard, premium]
                        priceUsd:
                          type: number
                          examples: [0.07, 0.35]
                        description:
                          type: string

components:

  parameters:
    Pool:
      name: pool
      in: path
      required: true
      description: >-
        The Uniswap v3 pool contract address, checksummed or lowercase. Must be a
        pool the subgraph has indexed. Rejected with 400 before any payment
        challenge if it is not an address.
      schema:
        type: string
        pattern: '^0x[0-9a-fA-F]{40}$'
      examples:
        usdcWeth005:
          summary: Uniswap v3 USDC/WETH 0.05% — the worked example throughout this document
          value: '0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640'

  headers:
    PaymentResponse:
      description: >-
        base64 of the `SettleResponse`. Decodes to
        `{ success, transaction, network, payer, amount }`. Keep `transaction` —
        it is the argument to `getReceipt`.
      schema:
        type: string

  responses:

    BadPool:
      description: >-
        The path parameter is not a pool address. Raised **before** a payment
        challenge is issued, so a payer is never charged for a request that could
        not have succeeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PaymentRequired:
      description: |-
        x402 v2 payment challenge.

        The same `PaymentRequired` object appears base64-encoded in the
        `PAYMENT-REQUIRED` response header **and** as the JSON body — the header is
        what the protocol reads, the body is what a human with curl sees. They are
        deep-equal, and a test asserts it.

        To pay: choose one entry from `accepts`, build the payload that entry's
        rail requires, and retry the same request with it base64-encoded in
        `PAYMENT-SIGNATURE`.
      headers:
        PAYMENT-REQUIRED:
          description: base64 of the `PaymentRequired` object below. x402 **v2** — not v1's `X-PAYMENT`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentRequired'

    ServiceError:
      description: The service could not complete the analysis.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    PaymentRequired:
      type: object
      description: The x402 v2 challenge, as this service emits it.
      required: [x402Version, error, resource, accepts]
      properties:
        x402Version:
          const: 2
        error:
          type: string
          examples: ['Payment required']
        resource:
          type: object
          description: >-
            v2 hoists the description and the URL out of each `accepts` entry into
            one object here. v1 put them on every entry as `resource` and
            `description`; if you are parsing another seller's 402, expect both.
          properties:
            url:
              type: string
            description:
              type: string
            mimeType:
              type: string
              examples: [application/json]
            serviceName:
              type: string
              examples: [liquidity.turnstile.eth]
        accepts:
          type: array
          minItems: 1
          description: >-
            One entry per rail willing to settle this request. **The buyer picks**,
            not the seller — the order they are listed in carries no preference,
            and a payer honouring a mandate that prefers the second entry must pay
            on the second.
          items:
            $ref: '#/components/schemas/PaymentRequirements'
        extensions:
          type: object
          description: Non-protocol hints. Turnstile puts the tier here.
          properties:
            turnstileTier:
              type: string
              enum: [standard, premium]

    PaymentRequirements:
      type: object
      description: One rail's terms for settling this specific request.
      required: [scheme, network, asset, amount, payTo, maxTimeoutSeconds]
      properties:
        scheme:
          type: string
          examples: [exact]
        network:
          type: string
          description: >-
            CAIP-2 where the rail has one, and the rail's own spelling where it
            does not. The live Hedera rail is `hedera:testnet` — **not**
            `eip155:296`, which the facilitator rejects.
          examples: ['hedera:testnet']
        asset:
          type: string
          description: >-
            Asset identifier in the rail's own namespace. `0.0.0` is native HBAR,
            8 decimals, on the live Hedera rail.
          examples: ['0.0.0']
        amount:
          type: string
          description: >-
            **An integer string in the asset's smallest unit, always** — never a
            decimal. Scaled through integer arithmetic on purpose: `0.07 * 1e6` in
            IEEE 754 is `69999.99999999999`, and a payment one unit light is
            rejected by the facilitator on a rail nobody is watching. HBAR is not a
            dollar, so the Hedera rail prices the USD tier through an FX rate and
            this is tinybars.
          pattern: '^[0-9]+$'
          examples: ['84367844']
        payTo:
          type: string
          description: The seller's payout address, in the rail's address format.
        maxTimeoutSeconds:
          type: integer
          examples: [300]
        extra:
          type: object
          description: |-
            **Where the chain-specific parts live**, and the reason one code path
            serves rails as different as Hedera's facilitator-cosigned transaction
            and Arc's authorization. `seller/service/` treats this object as
            opaque: it copies it onto the wire and hands it back to the rail
            untouched.

            `extra.resource` binds the challenge to the URL it was issued for, so a
            payment authorized for `/analyze/{pool}` cannot buy
            `/analyze/{pool}/attested`. That is checked twice, in two places that
            fail in different directions — the service rejects it on price, and the
            rail rejects it on the binding, because the service cannot read `extra`
            and the rail is not told which URL was requested.
          properties:
            facilitator:
              type: string
            settlementModel:
              type: string
              examples: [facilitator-cosigned-transaction, facilitator-authorization]
            decimals:
              type: integer
            symbol:
              type: string
            priceUsd:
              type: number
              description: The tier price in USD, before conversion into `amount`.
            resource:
              type: string
              description: The exact URL this challenge was issued for. Binding, not decoration.
            turnstileSettlement:
              type: string
              enum: [live, stub]
              description: >-
                `stub` means this rail advertises the shape of a real payment and
                settles nothing. Said on the wire rather than left to be discovered.

    Rail:
      type: object
      description: One payment rail, as /health describes it.
      properties:
        id:
          type: string
          examples: [hedera-x402, arc-usdc]
        label:
          type: string
        scheme:
          type: string
        network:
          type: string
        asset:
          type: object
          properties:
            id:
              type: string
            symbol:
              type: string
            decimals:
              type: integer
        ensRailToken:
          type: string
          description: The token used for this rail in the ENS offer records.
          examples: [x402, usdc-arc]
        live:
          type: boolean
          description: False while the rail is a placeholder that settles nothing.

    Verdict:
      type: object
      description: >-
        The answer to "is this pool safe to LP?", with the reasoning that produced
        it and the provenance needed to judge whether it has aged.
      required: [pool, poolAddress, rating, confidence, summary, signals, provenance, caveats]
      properties:
        pool:
          type: string
          examples: ['Uniswap v3 USDC/WETH 0.05%']
        poolAddress:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
        rating:
          type: string
          enum: [ACCEPTABLE, CAUTION, AVOID, INSUFFICIENT_DATA]
          description: >-
            `INSUFFICIENT_DATA` is a real answer, not an error. It means the
            evidence did not support any verdict.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            How much of the evidence the analyst wanted was actually available.
            Falls with no live quote, a stale subgraph, an unpriced token, or a
            self-referential price. 0.75 on the USDC/WETH 0.05% worked example.
        summary:
          type: string
          description: The one-paragraph answer, in prose.
        signals:
          type: array
          description: The reasoning, one observation per entry. This is *why* the rating is what it is.
          items:
            $ref: '#/components/schemas/Signal'
        provenance:
          type: object
          description: What a reader needs in order to judge whether this verdict has aged.
          required: [subgraph, subgraphTransport, subgraphBlock, subgraphLagSeconds, assessedAt]
          properties:
            subgraph:
              type: string
              description: The subgraph endpoint the history came from.
            subgraphTransport:
              type: string
              enum: [mcp, http]
              description: '`mcp` when queried through the Subgraph MCP server, `http` when queried directly.'
            subgraphBlock:
              type: integer
            subgraphLagSeconds:
              type: integer
              description: Seconds between the subgraph head and the assessment. How far behind the history is.
            depthProvider:
              type: [string, 'null']
              description: Null on the standard tier — that tier takes no live quote.
            depthBlock:
              type: [integer, 'null']
              description: The chain head the live quote was taken at. This is the number that makes a verdict current.
            assessedAt:
              type: integer
              description: Unix seconds.
        caveats:
          type: array
          items:
            type: string
          description: >-
            Everything the analyst wanted and did not get. Never silently empty —
            read this before acting on `rating`.

    Signal:
      type: object
      description: >-
        One reasoned observation. The evidence is what makes the verdict auditable
        rather than asserted.
      required: [id, label, verdict, structural, headline, evidence, reasoning]
      properties:
        id:
          type: string
        label:
          type: string
          examples: ['Executable depth', 'Depth against claimed TVL']
        verdict:
          type: string
          enum: [pass, warn, fail, unknown]
        structural:
          type: boolean
          description: >-
            A structural signal describes whether the pool is a *venue* at all. One
            failing structural signal is enough to justify AVOID; a non-structural
            one is a reason for care, not for walking away.
        headline:
          type: string
          description: 'One sentence: the conclusion and the number it rests on.'
        evidence:
          type: object
          additionalProperties:
            type: string
          description: The labelled numbers the headline is derived from.
        reasoning:
          type: string
          description: Why that evidence implies that verdict, for an LP specifically.

    AnalystInput:
      type: object
      description: >-
        The complete, serializable argument to the pure scorer. Premium tier only.
        Nothing in it is a handle, and `now` is a field rather than a clock read,
        which is what makes the verdict reproducible — and what let the scorer move
        into a Chainlink TEE enclave unchanged.
      required: [pool, depth, now]
      properties:
        pool:
          $ref: '#/components/schemas/PoolFacts'
        depth:
          oneOf:
            - $ref: '#/components/schemas/DepthProfile'
            - type: 'null'
          description: >-
            Null when live depth could not be obtained. The verdict must then say
            so in `caveats`.
        now:
          type: integer
          description: Unix seconds, supplied rather than read, so scoring stays deterministic.

    PoolFacts:
      type: object
      description: Everything the scorer knows about a pool's history. Sourced from the subgraph.
      properties:
        address:
          type: string
        name:
          type: string
        protocol:
          type: string
        network:
          type: string
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TokenFacts'
        createdTimestamp:
          type: integer
          description: >-
            Unix seconds the pool was created on chain — the honest floor for "how
            long has this existed".
        totalValueLockedUSD:
          type: number
          description: >-
            The *claimed* TVL. Compare it against the depth ladder before trusting
            it; on the worked example only 0.944% of it is reachable within 1%
            slippage.
        cumulativeVolumeUSD:
          type: number
        cumulativeSupplySideRevenueUSD:
          type: number
          description: Realized LP revenue. Realized, not projected.
        feeTierPct:
          type: [number, 'null']
          description: The LP-facing trading fee as a percentage — 0.05 means 0.05%.
        positionCount:
          type: integer
        openPositionCount:
          type: integer
        tick:
          type: [integer, 'null']
          description: Null on a non-concentrated AMM or an uninitialized pool.
        hourly:
          type: array
          description: >-
            Closed hourly intervals, most recent first. **Sparse**: the Messari
            handlers write a snapshot only when an event arrives in a new hour, so
            an hour with no activity produces no row at all rather than a row of
            zeroes. Counting non-empty rows therefore always returns 100% —
            activity has to be measured against elapsed hours, which is why `hour`
            is carried.
          items:
            $ref: '#/components/schemas/HourlyBucket'
        source:
          type: object
          description: Where the history came from, so a verdict can name its source.
          properties:
            label:
              type: string
            endpoint:
              type: string
            transport:
              type: string
              enum: [mcp, http]
            blockNumber:
              type: integer
            blockTimestamp:
              type: integer
              description: Unix seconds of the subgraph's head block — **not** of the query.

    TokenFacts:
      type: object
      description: One side of a pool, as the subgraph reports it.
      properties:
        address:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
        priceUSD:
          type: [number, 'null']
          description: >-
            Subgraph-derived. Null when the subgraph could not anchor it — and note
            it is derived from pools, so checking a pool against it is circular.
        balance:
          type: number
          description: Pool reserve in whole tokens, already decimal-adjusted.
        balanceUSD:
          type: [number, 'null']
          description: '`balance * priceUSD`, or null when the price is not knowable.'

    HourlyBucket:
      type: object
      description: One closed hourly interval from a Messari `LiquidityPoolHourlySnapshot`.
      properties:
        hour:
          type: integer
          description: >-
            `floor(unixSeconds / 3600)` — the interval's identity, carried so sparse
            buckets can be counted against elapsed hours.
        timestamp:
          type: integer
          description: Unix seconds of the block that closed the interval. Not an hour boundary.
        volumeUSD:
          type: number
        totalValueLockedUSD:
          type: number
        supplySideRevenueUSD:
          type: number

    DepthProfile:
      type: object
      description: >-
        Live depth-at-size from Uniswap. The half of the evidence that history
        cannot supply, and the only measurement in a verdict taken against the pool
        as it is now.
      properties:
        provider:
          type: string
          enum: [quoter-v2, trading-api]
        providerDetail:
          type: string
          description: Human-readable provenance — the QuoterV2 address and the RPC host.
        tokenInSymbol:
          type: string
        tokenOutSymbol:
          type: string
        atBlock:
          type: integer
          description: Chain head at quote time. The number that makes this live.
        quotedAt:
          type: integer
          description: Unix seconds when the quotes were taken.
        rungs:
          type: array
          description: The depth ladder, ascending by notional.
          items:
            $ref: '#/components/schemas/DepthRung'
        notionalPricing:
          type: object
          description: How the USD notionals were converted into token amounts.
          properties:
            tokenSymbol:
              type: string
            priceUSD:
              type: number
            priceSource:
              type: string
              enum: [subgraph-lastPriceUSD, caller-supplied]
              description: >-
                The scorer downgrades confidence on a self-referential price — one
                derived from the very pool being examined.

    DepthRung:
      type: object
      description: 'One rung of the depth ladder: what a trade of this size actually gets.'
      properties:
        notionalUSD:
          type: number
          description: The notional this rung was sized at, in USD.
        amountIn:
          type: number
          description: Input in whole tokens.
        amountOut:
          type: [number, 'null']
          description: Output in whole tokens. Null when the quote reverted.
        executedRate:
          type: [number, 'null']
          description: '`amountOut / amountIn`. Null when the quote reverted.'
        ticksCrossed:
          type: [integer, 'null']
          description: >-
            Initialized ticks the swap crossed. In concentrated liquidity this is
            how much of the range the trade had to eat through, and therefore how
            much worse the next trade will be. On the worked example $1.00M crosses
            9 and costs 0.385%; $10.00M crosses 125 and costs 4.837%. Null when the
            provider does not report it.
        error:
          type: string
          description: Present only on a failed rung — the revert or API error, verbatim.
