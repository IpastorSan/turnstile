<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Turnstile architecture — the three key tiers and the request path</title>
  <desc>Two panels. The first shows the cold, warm and hot key tiers: Ledger Key Ring holds the seller operator identity, Privy holds the buyer organization wallet and mandate policy, Circle on Arc holds the buyer agent spending wallet. Authority flows downward only; the hot key that spends can never raise its own limit. The second shows the request path from discovery through the offer, an HTTP 402, a payment rail, and the answer.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7E948F"/>
    </marker>
    <marker id="arrow-brass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D2A857"/>
    </marker>
  </defs>

  <rect width="1200" height="980" fill="#08191A"/>

  <!-- ── header ───────────────────────────────────────────────────────── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="46" fill="#5F7A74" font-size="13" letter-spacing="2.4">TURNSTILE · ARCHITECTURE</text>
  </g>
  <text x="40" y="82" fill="#E9E5D8" font-size="26" font-weight="700">The registry says who exists. Turnstile says what they cost.</text>

  <!-- ── panel A: the three key tiers ─────────────────────────────────── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="132" fill="#5F7A74" font-size="12.5" letter-spacing="2.2">A · THE THREE KEY TIERS</text>
  </g>

  <!-- COLD -->
  <g>
    <rect x="40" y="150" width="1120" height="104" fill="#0E2A28" stroke="#143B37"/>
    <rect x="40" y="150" width="3" height="104" fill="#8FB8C9"/>
    <rect x="40" y="150" width="188" height="104" fill="#0B2122"/>
    <text x="64" y="187" fill="#8FB8C9" font-size="21" font-weight="700" letter-spacing="1.5">COLD</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="64" y="212" fill="#5F7A74" font-size="12">once per</text>
      <text x="64" y="230" fill="#5F7A74" font-size="12">lifecycle</text>
    </g>
    <text x="256" y="184" fill="#E9E5D8" font-size="19" font-weight="600">Ledger Key Ring</text>
    <text x="256" y="211" fill="#93A8A2" font-size="14">Seller operator identity · owns the ENSv2 name</text>
    <text x="256" y="233" fill="#93A8A2" font-size="14">Seals upstream API keys</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="742" y="178" fill="#5F7A74" font-size="11" letter-spacing="1.6">MAY AUTHORIZE</text>
      <text x="742" y="201" fill="#D2A857" font-size="13">rotate the hot key</text>
      <text x="742" y="221" fill="#D2A857" font-size="13">move the payout address</text>
      <text x="742" y="241" fill="#D2A857" font-size="13">raise the price ceiling</text>
    </g>
  </g>

  <!-- WARM -->
  <g>
    <rect x="40" y="270" width="1120" height="104" fill="#0E2A28" stroke="#143B37"/>
    <rect x="40" y="270" width="3" height="104" fill="#D2A857"/>
    <rect x="40" y="270" width="188" height="104" fill="#0B2122"/>
    <text x="64" y="307" fill="#D2A857" font-size="21" font-weight="700" letter-spacing="1.5">WARM</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="64" y="332" fill="#5F7A74" font-size="12">occasional</text>
    </g>
    <text x="256" y="304" fill="#E9E5D8" font-size="19" font-weight="600">Privy</text>
    <text x="256" y="331" fill="#93A8A2" font-size="14">Buyer organization wallet</text>
    <text x="256" y="353" fill="#93A8A2" font-size="14">Holds the mandate policy</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="742" y="298" fill="#5F7A74" font-size="11" letter-spacing="1.6">MAY AUTHORIZE</text>
      <text x="742" y="321" fill="#D2A857" font-size="13">issue a mandate</text>
      <text x="742" y="341" fill="#D2A857" font-size="13">raise a cap (quorum)</text>
      <text x="742" y="361" fill="#D2A857" font-size="13">add an agent</text>
    </g>
  </g>

  <!-- HOT -->
  <g>
    <rect x="40" y="390" width="1120" height="104" fill="#0E2A28" stroke="#143B37"/>
    <rect x="40" y="390" width="3" height="104" fill="#E4593A"/>
    <rect x="40" y="390" width="188" height="104" fill="#0B2122"/>
    <text x="64" y="427" fill="#E4593A" font-size="21" font-weight="700" letter-spacing="1.5">HOT</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="64" y="452" fill="#5F7A74" font-size="12">every query</text>
    </g>
    <text x="256" y="424" fill="#E9E5D8" font-size="19" font-weight="600">Circle · Arc Agent Stack</text>
    <text x="256" y="451" fill="#93A8A2" font-size="14">Buyer agent’s spending wallet</text>
    <text x="256" y="473" fill="#93A8A2" font-size="14">Holds zero native token — Paymaster pays gas</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="742" y="418" fill="#5F7A74" font-size="11" letter-spacing="1.6">MAY AUTHORIZE</text>
      <text x="742" y="443" fill="#E4593A" font-size="15" font-weight="600">nothing</text>
      <text x="742" y="466" fill="#93A8A2" font-size="13">It spends inside the mandate.</text>
    </g>
  </g>

  <!-- authority flows down, never up -->
  <g>
    <line x1="204" y1="256" x2="204" y2="268" stroke="#7E948F" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="204" y1="376" x2="204" y2="388" stroke="#7E948F" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(1176 322)">
      <line x1="0" y1="150" x2="0" y2="-150" stroke="#E4593A" stroke-width="1.5" stroke-dasharray="5 4"/>
      <line x1="-9" y1="9" x2="9" y2="-9" stroke="#E4593A" stroke-width="2.5"/>
      <line x1="-9" y1="-9" x2="9" y2="9" stroke="#E4593A" stroke-width="2.5"/>
      <text transform="rotate(-90)" x="0" y="-16" fill="#E4593A" font-size="10.5" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.4">NO UPWARD AUTHORITY</text>
    </g>
  </g>

  <!-- the invariant -->
  <g>
    <rect x="40" y="512" width="1120" height="58" fill="#0B2122" stroke="#143B37"/>
    <rect x="40" y="512" width="3" height="58" fill="#D2A857"/>
    <text x="66" y="539" fill="#E9E5D8" font-size="17" font-weight="600">The invariant: the key that spends can never raise its own limit.</text>
    <text x="66" y="560" fill="#93A8A2" font-size="13.5">Authority flows downward only. If a change would let the hot tier widen its own mandate, rotate a key or move a payout address, the change is wrong.</text>
  </g>

  <!-- ── panel B: the request path ────────────────────────────────────── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="626" fill="#5F7A74" font-size="12.5" letter-spacing="2.2">B · THE REQUEST PATH</text>
  </g>

  <g>
    <!-- 1 discover -->
    <rect x="40" y="646" width="176" height="126" fill="#0E2A28" stroke="#143B37"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="60" y="674" fill="#5F7A74" font-size="11" letter-spacing="1.4">01</text>
    </g>
    <text x="60" y="700" fill="#E9E5D8" font-size="16" font-weight="600">Discover</text>
    <text x="60" y="722" fill="#93A8A2" font-size="12.5">ERC-8004 registry,</text>
    <text x="60" y="739" fill="#93A8A2" font-size="12.5">via Substreams</text>
    <text x="60" y="759" fill="#5F7A74" font-size="12">who exists</text>

    <!-- 2 read the offer -->
    <rect x="240" y="646" width="176" height="126" fill="#0E2A28" stroke="#D2A857"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="260" y="674" fill="#8A6F33" font-size="11" letter-spacing="1.4">02</text>
    </g>
    <text x="260" y="700" fill="#D2A857" font-size="16" font-weight="600">Read the offer</text>
    <text x="260" y="722" fill="#93A8A2" font-size="12.5">ENSv2 resolver:</text>
    <text x="260" y="739" fill="#93A8A2" font-size="12.5">turnstile:price</text>
    <text x="260" y="759" fill="#D2A857" font-size="12">what it costs</text>

    <!-- 3 ask -->
    <rect x="440" y="646" width="176" height="126" fill="#0E2A28" stroke="#143B37"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="460" y="674" fill="#5F7A74" font-size="11" letter-spacing="1.4">03</text>
    </g>
    <text x="460" y="700" fill="#E9E5D8" font-size="16" font-weight="600">Ask</text>
    <text x="460" y="722" fill="#93A8A2" font-size="12.5">MCP call to</text>
    <text x="460" y="739" fill="#93A8A2" font-size="12.5">agent-endpoint[mcp]</text>
    <text x="460" y="759" fill="#5F7A74" font-size="12">the query</text>

    <!-- 4 402 -->
    <rect x="640" y="646" width="176" height="126" fill="#0E2A28" stroke="#143B37"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="660" y="674" fill="#5F7A74" font-size="11" letter-spacing="1.4">04</text>
    </g>
    <text x="660" y="700" fill="#E9E5D8" font-size="16" font-weight="600">402 Payment</text>
    <text x="660" y="722" fill="#93A8A2" font-size="12.5">Quote must match</text>
    <text x="660" y="739" fill="#93A8A2" font-size="12.5">the posted price</text>
    <text x="660" y="759" fill="#5F7A74" font-size="12">the demand</text>

    <!-- 5 pay -->
    <rect x="840" y="646" width="176" height="126" fill="#0E2A28" stroke="#143B37"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="860" y="674" fill="#5F7A74" font-size="11" letter-spacing="1.4">05</text>
    </g>
    <text x="860" y="700" fill="#E9E5D8" font-size="16" font-weight="600">Pay the rail</text>
    <text x="860" y="722" fill="#93A8A2" font-size="12.5">x402, or USDC</text>
    <text x="860" y="739" fill="#93A8A2" font-size="12.5">on Arc · hot key</text>
    <text x="860" y="759" fill="#5F7A74" font-size="12">within the mandate</text>

    <!-- 6 answer -->
    <rect x="1040" y="646" width="120" height="126" fill="#0E2A28" stroke="#143B37"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="1060" y="674" fill="#5F7A74" font-size="11" letter-spacing="1.4">06</text>
    </g>
    <text x="1060" y="700" fill="#E9E5D8" font-size="16" font-weight="600">Answer</text>
    <text x="1060" y="722" fill="#93A8A2" font-size="12.5">The result,</text>
    <text x="1060" y="739" fill="#93A8A2" font-size="12.5">not the method</text>

    <line x1="220" y1="709" x2="236" y2="709" stroke="#7E948F" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="420" y1="709" x2="436" y2="709" stroke="#D2A857" stroke-width="1.5" marker-end="url(#arrow-brass)"/>
    <line x1="620" y1="709" x2="636" y2="709" stroke="#7E948F" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="820" y1="709" x2="836" y2="709" stroke="#7E948F" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="1020" y1="709" x2="1036" y2="709" stroke="#7E948F" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- step 2 is the one the registry cannot do -->
  <g>
    <path d="M 328 646 L 328 616 L 328 616" stroke="#D2A857" stroke-width="1.5" fill="none"/>
    <text x="344" y="612" fill="#D2A857" font-size="13" font-weight="600">Step 02 is the leg the registry cannot supply.</text>
    <text x="344" y="631" fill="#93A8A2" font-size="12.5">EIP-8004 registration has no price field; 1 of 197 live agents publishes a readable price.</text>
  </g>

  <!-- footer band -->
  <g>
    <rect x="40" y="806" width="1120" height="76" fill="#0B2122" stroke="#143B37"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="66" y="832" fill="#5F7A74" font-size="11" letter-spacing="1.6">WHAT SITS WHERE</text>
      <text x="66" y="856" fill="#93A8A2" font-size="12.5">graph/substreams + graph/sink → discovery store   ·   seller/service/discovery.ts → find_sellers   ·   mcp-turnstile → MCP tool</text>
      <text x="66" y="874" fill="#93A8A2" font-size="12.5">contracts/ → ENSv2 name, resolver, ENSIP-25/26 offer records   ·   web/ → market and seller pages, live reads</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="924" fill="#5F7A74" font-size="11.5">ETHOnline 2026 · built from scratch · MIT</text>
    <text x="1160" y="924" fill="#5F7A74" font-size="11.5" text-anchor="end">Sells the answer, keeps the method.</text>
  </g>
</svg>
